name: Владимир Приходько
title: Специалист технической поддержки · Service Desk · IT Support

summary: >
  Специалист технической поддержки (Service Desk) с 5-летним опытом сопровождения
  IT-инфраструктуры и клиентских систем. Владею процессами Incident Management
  и Request Management. Настраивал корпоративные сервисы (CRM, IP-телефония, почта),
  работал с базами обращений и соблюдал SLA. Диагностирую сложные технические проблемы,
  эскалирую задачи и веду техническую документацию. Ориентирован на автоматизацию
  процессов поддержки и качество взаимодействия с пользователями.

achievements:
  - Обработка до 250 и более обращений ежедневно
  - Организация IT-инфраструктуры для новых пользователей — почта, домены, CRM, IP-телефония, рабочие чаты
  - Контроль выполнения задач и соблюдение SLA
  - Опыт работы на 1-й и 2-й линиях поддержки

